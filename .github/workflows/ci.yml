name: CI

on:
  push:
    branches:
      - '**'
  pull_request:
    branches:
      - main

jobs:
  build:
    name: Build & Test on ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node-version: [20.x]

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Compile Extension
        run: npm run compile

      - name: Run tests (Linux)
        if: runner.os == 'Linux'
        run: xvfb-run -a --server-args="-screen 0 1024x768x24" npm test

      - name: Run tests (Windows/macOS)
        if: runner.os != 'Linux'
        run: npm test
        env:
          # On macOS, also download the latest ctrace release and run it.
          CORETRACE_E2E_DOWNLOAD: '1'
          GITHUB_TOKEN: ${{ github.token }}

  license-gate:
    name: License gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Test the license check
        run: npm run test:licenses

      - name: Check licenses against policy and baseline
        run: npm run licenses

      - name: Generate SBOM (CycloneDX)
        if: always()
        run: npm sbom --omit dev --sbom-format cyclonedx > sbom.cdx.json

      - name: Upload SBOM
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: sbom.cdx.json
